name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  release:
    types: [created]

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install lint tools
        run: |
          pip install black ruff mypy

      - name: Run Black
        run: black --check gpt_oss/

      - name: Run Ruff
        run: ruff check gpt_oss/

      - name: Run MyPy
        run: mypy gpt_oss/ --ignore-missing-imports

  build_wheel:
    name: Build wheel (macOS ARM64)
    runs-on: macos-14  # M1 Mac, macOS 15.2
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          pip install build twine cibuildwheel pybind11

      - name: Download Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain 2>/dev/null || echo "MetalToolchain already available"

      - name: Get macOS version
        run: |
          echo "MACOS_VERSION=$(sw_vers -productVersion)" >> $GITHUB_ENV

      - name: Build wheel
        run: |
          python -m cibuildwheel --platform macos --arch arm64 --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-win32 *-manylinux* *-musllinux*"
          CIBW_BEFORE_ALL_MACOS: |
            pip install pybind11
            xcodebuild -downloadComponent MetalToolchain 2>/dev/null || true
          CIBW_TEST_COMMAND: "python -c 'import gpt_oss.metal._metal; print(\"OK\")'"
          # Minimum: macOS 13.0, Tested on: macOS ${{ env.MACOS_VERSION }}

      - name: Show build info
        run: |
          echo "Built on: macOS ${{ env.MACOS_VERSION }}"
          ls -la wheelhouse/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

      - name: Verify wheel contents
        run: |
          ls -la wheelhouse/
          unzip -l wheelhouse/*.whl | head -50

  pypi_release:
    name: PyPI release
    runs-on: macos-14
    needs: build_wheel
    if: github.event_name == 'release' && contains(github.ref, 'refs/tags/v')

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheelhouse

      - name: Install twine
        run: pip install twine

      - name: Check package metadata
        run: twine check wheelhouse/*.whl

      - name: Upload to PyPI
        run: twine upload wheelhouse/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  build_sdist:
    name: Build source distribution
    runs-on: macos-14
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

      - name: Create GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
