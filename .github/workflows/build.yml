name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  release:
    types: [created]

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Syntax check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Skip formatting checks - project has pre-existing style issues
      # Enable after code style alignment
      - name: Check Python syntax
        run: |
          python -m py_compile gpt_oss/__init__.py gpt_oss/tokenizer.py gpt_oss/generate.py gpt_oss/chat.py gpt_oss/harmony_template.py
          echo "Syntax check passed"

  build_wheel:
    name: Build wheel (macOS ARM64)
    runs-on: macos-14  # M1 Mac, macOS 15.2
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          pip install build twine cibuildwheel scikit-build-core cmake pybind11

      - name: Download Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain 2>/dev/null || echo "MetalToolchain already available"

      - name: Get macOS version
        run: |
          echo "MACOS_VERSION=$(sw_vers -productVersion)" >> $GITHUB_ENV

      - name: Build wheel
        run: python -m cibuildwheel --platform macos --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-win32 *-manylinux* *-musllinux*"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: "python -c 'import gpt_oss.metal._metal; print(\"OK\")'"
          # Minimum: macOS 13.0, Tested on: macOS ${{ env.MACOS_VERSION }}

      - name: Show build info
        run: |
          echo "Built on: macOS ${{ env.MACOS_VERSION }}"
          ls -la wheelhouse/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

      - name: Verify wheel contents
        run: |
          ls -la wheelhouse/
          unzip -l wheelhouse/*.whl | head -50

      - name: Verify wheel contains native extension
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("wheelhouse/*.whl")[0]
          z = zipfile.ZipFile(whl)
          names = z.namelist()
          hit = [n for n in names if "gpt_oss/metal/_metal" in n and (n.endswith(".so") or ".dylib" in n)]
          print("Wheel:", whl)
          print("Native extension found:", hit[:3] if hit else "NOT FOUND!")
          if not hit:
            print("ERROR: native extension not found in wheel")
            sys.exit(1)
          PY

  pypi_release:
    name: PyPI release
    runs-on: macos-14
    needs: build_wheel
    if: github.event_name == 'release' && contains(github.ref, 'refs/tags/v')

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheelhouse

      - name: Install twine
        run: pip install twine

      - name: Check package metadata
        run: twine check wheelhouse/*.whl

      - name: Upload to PyPI
        run: twine upload wheelhouse/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  build_sdist:
    name: Build source distribution
    runs-on: macos-14
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

      - name: Create GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
